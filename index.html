<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaxmat Streak</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet"
    href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
</head>
<body>

  <!-- SPLASH -->
  <div id="splash-screen" class="screen active">
    <div class="splash-content">
      <div class="logo">&#9823;</div>
      <h1>Shaxmat Streak</h1>
      <p class="tagline">Zadachalarni yech, streakni oshir!</p>
      <div class="rules">
        <div class="rule-item"><span class="rule-icon">&#9200;</span><span>Vaqt chekovi yo'q</span></div>
        <div class="rule-item"><span class="rule-icon">&#10060;</span><span>Bitta xato = o'yin tugaydi</span></div>
        <div class="rule-item"><span class="rule-icon">&#9193;</span><span>1 ta skip huquqi</span></div>
        <div class="rule-item"><span class="rule-icon">&#128200;</span><span>Tobora qiyinlashadi</span></div>
      </div>
      <button id="start-btn" class="btn-primary">Boshlash</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <div class="header-left"><span class="logo-small">&#9823; Streak</span></div>
      <div class="streak-counter">
        <span class="streak-label">STREAK</span>
        <span id="streak-count">0</span>
      </div>
      <div class="header-right">
        <button id="skip-btn" class="btn-skip">&#9193; Skip <span id="skip-count">(1)</span></button>
      </div>
    </header>
    <main class="game-main">
      <div class="puzzle-info">
        <div class="puzzle-meta">
          <span id="puzzle-number">Zadacha #1</span>
          <span id="puzzle-difficulty" class="difficulty-badge">Oson</span>
        </div>
        <div id="status-message" class="status-message status-thinking">Yurish navbatingiz!</div>
      </div>
      <div class="board-area">
        <div class="player-label" id="top-player">
          <span class="player-color-dot black"></span>
          <span id="top-player-name">Qora</span>
        </div>
        <div id="board-wrapper"><div id="board"></div></div>
        <div class="player-label" id="bottom-player">
          <span class="player-color-dot white"></span>
          <span id="bottom-player-name">Oq (Siz)</span>
        </div>
      </div>
      <div class="side-panel">
        <div class="move-history"><h3>Yurishlar</h3><div id="moves-list"></div></div>
        <div class="puzzle-progress">
          <div class="progress-bar-wrapper"><div id="progress-bar" class="progress-bar"></div></div>
          <span id="progress-text">0 / 20</span>
        </div>
      </div>
    </main>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-screen" class="screen">
    <div class="gameover-content">
      <div class="gameover-icon" id="gameover-icon">&#128165;</div>
      <h2 id="gameover-title">O'yin tugadi!</h2>
      <p id="gameover-message">Noto'g'ri yurish!</p>
      <div class="final-score">
        <span class="score-label">STREAK</span>
        <span class="score-number" id="final-streak">0</span>
      </div>
      <button id="retry-btn" class="btn-primary">Qayta boshlash</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="puzzles.js"></script>
  <script src="app.js"></script>
</body>
</html>
